name: Verify

on:
  push:
    branches: [staging, main]
    paths-ignore: ["docs/src/content/**"]
  pull_request:
    paths-ignore: ["docs/src/content/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TREESEED_STAGE_WAIT_MODE: skip
      TREESEED_AGENT_DISABLE_GIT: "true"
      TREESEED_FIXTURE_ID: treeseed-working-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Assert node:sqlite availability
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite available')).catch((error) => { console.error(error); process.exit(1); })"

      - name: Install dependencies
        timeout-minutes: 20
        run: npm ci --no-audit --no-fund

      - name: Verify package
        run: npm run verify:direct

      - name: Pack verified artifact
        run: mkdir -p artifacts && npm pack --json --ignore-scripts --pack-destination artifacts

      - name: Seal protected staging candidate
        if: github.ref == 'refs/heads/staging'
        run: |
          npm sbom --sbom-format cyclonedx > artifacts/sbom.cdx.json
          artifact="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          npm run release:custody -- seal artifacts/release-evidence-v1.json "$artifact"
          npm run release:custody -- verify artifacts/release-evidence-v1.json

      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Upload sealed staging custody
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: core-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
