id: "@treeseed/core"
name: TreeSeed Core
kind: node-typescript
type: node-library
repository: treeseed-ai/core
publishTarget: npm
capabilities: { save: true, verify: true, publish: true, deploy: false, localOnly: false }
workflowTemplateVersion: "1"
githubEnvironments:
  - production
requiredSecrets:
  - NPM_TOKEN
verify:
  fast: npm run verify
  local: npm run verify:local
  release: npm run release:verify
artifacts:
  - provider: npm
    name: "@treeseed/core"
releaseGate:
  workflow: verify.yml
standards:
  schemaVersion: 1
  workflow: { enabled: true }
  acceptedBaseline: { packageName: "@treeseed/core", packageVersion: "0.12.59" }
  produced:
    - { id: "@treeseed/core/site-plugin-runtime", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: dist, artifact: .treeseed/standards/site-plugin-runtime.json, verifier: scripts/packages/release-verify.ts }
  consumed:
    - { id: "@treeseed/sdk/typescript-public-api", family: typescript, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/sdk, verifier: scripts/packages/release-verify.ts }
    - { id: "@treeseed/ui/presentation-catalog", family: behavioral, version: "1.0.0", semanticRange: "^1.0.0", source: node_modules/@treeseed/ui, verifier: scripts/packages/release-verify.ts }
  guarantees: [managed-node-fail-closed, hosted-cloudflare-retained, packaged-route-composition]
  deprecations: []
  runtimes: [node>=22, cloudflare-workers]
  rollbackOperations: [remove-prerelease-dist-tag, restore-accepted-composition]
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/core
